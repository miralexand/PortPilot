name: Release

on:
  push:
    tags:
      - '0.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build Windows installers
        run: npm run dist

      - name: Prepare release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mv dist/PortPilot-*-x64.exe "dist/PortPilot-${tag}-x64.exe"
          mv dist/PortPilot-*-portable.exe "dist/PortPilot-${tag}-portable.exe"
          sha256sum "dist/PortPilot-${tag}-x64.exe" "dist/PortPilot-${tag}-portable.exe" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=(
            "dist/PortPilot-${tag}-x64.exe"
            "dist/PortPilot-${tag}-portable.exe"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "PortPilot ${tag}" --generate-notes
          fi
