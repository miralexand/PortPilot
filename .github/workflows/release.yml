name: Release

on:
  push:
    tags:
      - '0.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        timeout-minutes: 5
        run: npm test

      - name: Build Windows installers
        timeout-minutes: 20
        run: npm run dist

      - name: Verify artifacts
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = "dist/PortPilot-$tag-x64.exe"
          $portable = "dist/PortPilot-$tag-portable.exe"
          Get-ChildItem dist | Select-Object Name, Length
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          if (-not (Test-Path $portable)) { throw "Missing $portable" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: PortPilot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/PortPilot-${{ github.ref_name }}-x64.exe
            dist/PortPilot-${{ github.ref_name }}-portable.exe
